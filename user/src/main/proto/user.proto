syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.microfeur.user.grpc";

service UserService {
  rpc GetUser (UserRequest) returns (UserReply);
}

message UserRequest {
  string id = 1;
}

message UserReply {
  string id = 1;
  string nom = 2;
  string prenom = 3;
  bool exists = 4;
}